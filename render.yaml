services:
  - type: web
    name: salama-tunisie
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install --include=dev --legacy-peer-deps && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
